server.port=8080
server.address=0.0.0.0
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# --- RUTAS DE MICROSERVICIOS ---

# 0. Autenticación
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTENTICACION-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# 1. Usuarios
spring.cloud.gateway.routes[1].id=usuarios-service
spring.cloud.gateway.routes[1].uri=lb://USUARIOS-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/usuarios/**,/api/ciudades/**

# 2. Pagos
spring.cloud.gateway.routes[2].id=pagos-service
spring.cloud.gateway.routes[2].uri=lb://PAGOS-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/pagos/**

# 3. Notificaciones
spring.cloud.gateway.routes[3].id=notificaciones-service
spring.cloud.gateway.routes[3].uri=lb://NOTIFICACIONES-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notificaciones/**

# 4. Reportes
spring.cloud.gateway.routes[4].id=reportes-service
spring.cloud.gateway.routes[4].uri=lb://REPORTES-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/reportes/**

# --- RUTAS OPENAPI PARA SWAGGER (índices continuos del 5 al 9) ---

# 5. OpenAPI Autenticación
spring.cloud.gateway.routes[5].id=auth-openapi
spring.cloud.gateway.routes[5].uri=lb://AUTENTICACION-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/v3/api-docs/auth
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/v3/api-docs/auth, /v3/api-docs

# 6. OpenAPI Usuarios
spring.cloud.gateway.routes[6].id=usuarios-openapi
spring.cloud.gateway.routes[6].uri=lb://USUARIOS-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/v3/api-docs/usuarios
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/v3/api-docs/usuarios, /v3/api-docs

# 7. OpenAPI Pagos
spring.cloud.gateway.routes[7].id=pagos-openapi
spring.cloud.gateway.routes[7].uri=lb://PAGOS-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/v3/api-docs/pagos
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/v3/api-docs/pagos, /v3/api-docs

# 8. OpenAPI Notificaciones
spring.cloud.gateway.routes[8].id=notificaciones-openapi
spring.cloud.gateway.routes[8].uri=lb://NOTIFICACIONES-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/v3/api-docs/notificaciones
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/v3/api-docs/notificaciones, /v3/api-docs

# 9. OpenAPI Reportes
spring.cloud.gateway.routes[9].id=reportes-openapi
spring.cloud.gateway.routes[9].uri=lb://REPORTES-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/v3/api-docs/reportes
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/v3/api-docs/reportes, /v3/api-docs

# --- INTERFAZ CENTRALIZADA DE SWAGGER ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Autenticación
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth
springdoc.swagger-ui.urls[1].name=Usuarios
springdoc.swagger-ui.urls[1].url=/v3/api-docs/usuarios
springdoc.swagger-ui.urls[2].name=Pagos
springdoc.swagger-ui.urls[2].url=/v3/api-docs/pagos
springdoc.swagger-ui.urls[3].name=Notificaciones
springdoc.swagger-ui.urls[3].url=/v3/api-docs/notificaciones
springdoc.swagger-ui.urls[4].name=Reportes
springdoc.swagger-ui.urls[4].url=/v3/api-docs/reportes

# --- CORS ---
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*